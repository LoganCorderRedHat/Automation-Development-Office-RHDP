{{- /*
  Seat password from the RHDP order (openshift.adminPassword). The setup job
  uses it as the Gitea lab-user password, so the lab guide can show it from
  RHDP's own openshift_cluster_admin_password attribute.
*/ -}}
{{- $openshift := .Values.openshift | default dict }}
{{- if $openshift.adminPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ansible-runner.fullname" . }}-seat
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ansible-runner.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.rbac | quote }}
type: Opaque
data:
  gitea-user-password: {{ $openshift.adminPassword | b64enc | quote }}
{{- end }}
